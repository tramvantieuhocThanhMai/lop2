<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện Bài tập Tiếng Việt — Lớp 2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: #fff8ec;
    color: #33312e;
    line-height: 1.5;
  }
  header {
    background: #ff8a3d;
    color: #fff;
    text-align: center;
    padding: 30px 16px 26px;
    border-radius: 0 0 28px 28px;
  }
  header .tag { font-size: .85rem; letter-spacing: 2px; font-weight: 700; opacity: .9; }
  header h1 { margin: 6px 0 8px; font-size: 1.7rem; }
  header p { margin: 0 auto; max-width: 560px; font-size: 1rem; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 14px 40px; }
  h2 { font-size: 1.2rem; margin: 8px 0 14px; color: #c9560a; }
  .list { display: grid; gap: 12px; }
  a.item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border: 2px solid #ffd2b0;
    border-radius: 16px;
    padding: 12px 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 3px 0 #ffd2b0;
  }
  a.item:hover, a.item:focus { border-color: #ff8a3d; box-shadow: 0 3px 0 #ff8a3d; }
  .badge {
    flex: 0 0 52px;
    height: 52px;
    border-radius: 14px;
    background: #ff8a3d;
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .text { flex: 1; min-width: 0; }
  .text b { display: block; font-size: 1.08rem; color: #33312e; }
  .text span { font-size: .9rem; color: #7d766a; }
  .arrow { font-size: 1.3rem; color: #ff8a3d; font-weight: 700; }
  footer { text-align: center; font-size: .9rem; color: #8a8377; padding: 0 14px 28px; }
</style>
</head>
<body>
<header>
  <div class="tag">THƯ VIỆN BÀI TẬP</div>
  <h1>Bài tập Tiếng Việt — Lớp 2</h1>
  <p>Chọn đúng tuần học để bắt đầu làm bài. Mỗi bài đều được chấm điểm tự động ngay khi nộp.</p>
</header>

<main>
  <h2>📚 Phiếu bài tập tuần — Năm học 2026 – 2027</h2>
  <div class="list" id="list"></div>
</main>

<footer>Thư viện bài tập của cô Thanh Mai · Cập nhật theo từng tuần 🌈</footer>

<script>
  // ====== CÔ CHỈ CẦN SỬA Ở ĐÂY ======
  // Mỗi tuần là 1 dòng: tuan = số tuần, ten = tên bài / nội dung học,
  // mota = các dạng bài, file = tên file đã tải lên GitHub.
  // Thêm tuần mới: chép 1 dòng, sửa lại nội dung, nhớ giữ dấu phẩy cuối dòng.
  var DANH_SACH = [
    { tuan: 1, ten: "Từ chỉ sự vật, hoạt động. Câu giới thiệu", mota: "Luyện từ và câu · Chấm điểm tự động", file: "phieu-lop2-tuan1.html" },
    { tuan: 2, ten: "Từ chỉ sự vật, hoạt động. Câu giới thiệu (tiếp)", mota: "Luyện từ và câu · Chấm điểm tự động", file: "phieu-lop2-tuan2.html" },
    { tuan: 5, ten: "Khi trang sách mở ra", mota: "Đọc hiểu · Luyện tập · Chấm điểm tự động", file: "phieu-lop2-tuan5.html" },
  ];
  // ===================================

  var list = document.getElementById("list");
  DANH_SACH.sort(function (a, b) { return a.tuan - b.tuan; });
  DANH_SACH.forEach(function (d) {
    var a = document.createElement("a");
    a.className = "item";
    a.href = d.file;
    var badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = "T" + d.tuan;
    var text = document.createElement("div");
    text.className = "text";
    var b = document.createElement("b");
    b.textContent = "Tuần " + d.tuan + " — " + d.ten;
    var s = document.createElement("span");
    s.textContent = d.mota;
    text.appendChild(b);
    text.appendChild(s);
    var arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.textContent = "→";
    a.appendChild(badge);
    a.appendChild(text);
    a.appendChild(arrow);
    list.appendChild(a);
  });
</script>
</body>
</html>
